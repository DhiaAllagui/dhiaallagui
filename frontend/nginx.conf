server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend container (/api/equipe -> backend:8080/equipe)
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
    }

    # Angular routes: always serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
