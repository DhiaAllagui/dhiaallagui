# Structure from Chapter 3, slide 25: MySQL -> Spring Boot -> Angular
# Images are published on Docker Hub (dhiaallagui/...). "build" lets you
# rebuild them locally, then publish them with: docker compose push
services:
  mysqldb:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: devops_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - devops-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  springapp:
    image: dhiaallagui/devops-app:1.0.0
    build: ./backend
    depends_on:
      mysqldb:
        condition: service_healthy   # starts once MySQL accepts connections
    ports:
      - "8081:8080"                  # 8081 on the VM, because Jenkins already uses 8080
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/devops_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: secret
    networks:
      - devops-net
    restart: unless-stopped

  angular:
    image: dhiaallagui/devops-front:1.0.0
    build: ./frontend
    depends_on:
      - springapp
    ports:
      - "4200:80"
    networks:
      - devops-net
    restart: unless-stopped

networks:
  devops-net:

volumes:
  mysql-data:
