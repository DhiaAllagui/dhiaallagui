services:
  mysql:
    image: mysql:8.0
    container_name: gp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    ports:
      - "3307:3306"          # 3307 on the VM, to avoid clashing with a local MySQL
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: gp-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/test_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8081:8080"          # 8081 on the VM, because Jenkins already uses 8080
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: gp-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql-data:
